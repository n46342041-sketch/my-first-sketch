<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="site-header">
        <nav class="navbar">
            <a href="index.html" class="logo">Student Portal</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="form.html">Register</a>
                <a href="thanks.html">Thank You</a>
            </div>
        </nav>
    </header>

    <main class="form-page">
        <section class="form-container">
            <!-- Inline CSS -->
            <h1 style="color: #2457a7; text-align: center;">
                Student Registration Form
            </h1>

            <p class="form-description">
                Please complete the form below to register as a student.
            </p>

            <form action="thanks.html" method="get">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="student@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        autocomplete="tel"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input
                        type="date"
                        id="dob"
                        name="dob"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="course">Select Course</label>
                    <select id="course" name="course" required>
                        <option value="">Choose a course</option>
                        <option value="computer-science">Computer Science</option>
                        <option value="business">Business Administration</option>
                        <option value="engineering">Engineering</option>
                        <option value="arts">Arts and Humanities</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Additional Information</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="4"
                        placeholder="Tell us something about yourself"
                    ></textarea>
                </div>

                <div class="form-group checkbox-group">
                    <input
                        type="checkbox"
                        id="agreement"
                        name="agreement"
                     required
                    >
                    <label for="agreement">
                        I confirm that the information provided is correct.
                    </label>
                </div>

                <button type="submit" class="btn submit-btn">
                    Submit Registration
                </button>
            </form>

            <p class="back-link">
                <a href="index.html">← Back to Home</a>
            </p>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Student Portal. All rights reserved.</p>
    </footer>

</body>
</html>
